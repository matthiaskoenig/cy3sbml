[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cy3sbml"
version = "0.1.0"
description = "Visualize SBML models in Cytoscape with cy3sbml"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.2.2",
    "platformdirs>=4.3",
    "py4cytoscape>=1.13.0",
    "requests>=2.33.0",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
antimony = [
    "antimony>=3.1.3",
    # The Windows wheel of Antimony 3.2.0 raises a C++ exception when loading text.
    "antimony!=3.2.0; sys_platform == 'win32'",
]

[project.urls]
Documentation = "https://matthiaskoenig.github.io/cy3sbml/guide/automation/#python"
Repository = "https://github.com/matthiaskoenig/cy3sbml"
Issues = "https://github.com/matthiaskoenig/cy3sbml/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
    "twine>=6",
    "ty>=0.0.110",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
extend = "../ruff.toml"
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"
