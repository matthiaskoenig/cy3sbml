[project]
name = "cy3sbml-examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cy3sbml",
    "pandas>=3.1.1",
    "py4cytoscape>=1.13.0",
]

[tool.uv.sources]
cy3sbml = { path = "../../python", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

# the examples are checked with ruff (ruff.toml of the repository) and ty, see README.md
[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"
