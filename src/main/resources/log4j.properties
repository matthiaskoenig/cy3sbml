################################################################################
# log4j settings
################################################################################ 

# Set the default levels and targets
log4j.rootCategory=WARN, console

log4j.logger.uk.ac.ebi.pride.utilities.ols=WARN
log4j.logger.org.sbml=WARN
log4j.logger.org.sbml.jsbml.AbstractMathContainer=ERROR
log4j.logger.org.cy3sbml=INFO

# 'console'
log4j.appender.console.Threshold=INFO
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%5p (%F:%L) - %m%n