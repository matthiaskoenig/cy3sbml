# Logging of JSBML (log4j 1.x API, reload4j) in the tests. Takes precedence over
# src/main/resources/log4j.properties.
log4j.rootCategory=WARN, console

log4j.logger.org.sbml.jsbml.AbstractMathContainer=ERROR
# The JSBML XML parsers warn on the test models (notes without the XHTML namespace,
# unknown attributes, broken files); other JSBML warnings stay visible.
log4j.logger.org.sbml.jsbml.xml=ERROR

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%5p (%F:%L) - %m%n
