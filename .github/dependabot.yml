# Keep the GitHub Actions, the Maven and the Python dependencies up to date.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
registries:
  # the Cytoscape API artifacts (pom.xml repositories); public, but Dependabot only
  # reaches the Maven repositories declared here
  cytoscape-releases:
    type: maven-repository
    url: https://nrnb-nexus.ucsd.edu/repository/cytoscape_releases/
  cytoscape-thirdparty:
    type: maven-repository
    url: https://nrnb-nexus.ucsd.edu/repository/cytoscape_thirdparty/
updates:
  - package-ecosystem: "github-actions"
    # the actions are pinned to commit SHAs with the version as a comment,
    # Dependabot updates both
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
  - package-ecosystem: "uv"
    # the Python helpers (tools/pyproject.toml) and the Python examples of the
    # automation commands (examples/python/pyproject.toml)
    directories:
      - "/tools"
      - "/examples/python"
    schedule:
      interval: "weekly"
    groups:
      python-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
  - package-ecosystem: "pip"
    # zensical, the documentation build, see docs/requirements.txt
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docs"
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - cytoscape-releases
      - cytoscape-thirdparty
    schedule:
      interval: "weekly"
    groups:
      # a dependency joins the first group whose patterns match it, so the
      # runtime-bound groups come before the catch-all
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "*-maven-plugin"
      cytoscape-api:
        patterns:
          - "org.cytoscape:*"
      javafx:
        patterns:
          - "org.openjfx:*"
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # built from source into lib/cy3sbml-dep, see docs/development/dependencies.md
      - dependency-name: "cy3sbml-dep:*"
      # the Cytoscape API version is the minimum Cytoscape the app runs on;
      # raise it deliberately, not through a dependency update
      - dependency-name: "org.cytoscape:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # JavaFX is provided by the Cytoscape runtime (Java 17); newer major
      # versions need a newer JDK
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]
      # the OSGi APIs are provided by Cytoscape's framework (Felix 6.0.5 in
      # Cytoscape 3.10.x, OSGi R7, org.osgi.framework 1.9); compiling against
      # R8 (osgi.core 8) makes the bundle import org.osgi.framework [1.10,2),
      # which does not resolve in Cytoscape
      - dependency-name: "org.osgi:*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
