name: CI

on:
  push:
    # feature branches are tested through their pull request
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Publish the test report
        # creating the check run needs checks: write, which the token of a pull
        # request from a fork never has; the report is informational, so the
        # test result alone decides the job (and the required tests check)
        if: >-
          (success() || failure()) &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: scacap/action-surefire-report@v1
        with:
          check_name: surefire (${{ matrix.os }})
      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

  tests:
    # the check the branch protection requires; the names of the matrix jobs
    # change with the matrix, this name does not
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the test matrix
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          test "$RESULT" = "success"

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Check the formatting
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

  lint:
    # Error Prone needs JDK 21 or newer to run; the code still compiles
    # with release 17
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Check the code with Error Prone and compiler warnings
        run: ./mvnw --batch-mode --no-transfer-progress -Plint -DskipTests test-compile

  python:
    # the Python helpers in scripts/ and tools/pycysbml, see
    # docs/development/quality.md
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install the tools project
        run: uv sync --project tools --locked
      - name: Check the code with ruff
        run: uv run --project tools --locked ruff check --output-format=github
      - name: Check the formatting with ruff
        run: uv run --project tools --locked ruff format --check
      - name: Check the types with ty
        run: uv run --project tools --locked ty check --output-format=github
      - name: Self-check the release notes script
        run: uv run --project tools --locked python scripts/release_notes.py --check
      - name: Self-check the JSBML update script
        run: uv run --project tools --locked python scripts/update_jsbml.py --check
