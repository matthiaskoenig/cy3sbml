name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release notes
        # fail before the build if the release notes are missing
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "release-notes/${VERSION}.md" || {
            echo "::error::release-notes/${VERSION}.md is missing"
            exit 1
          }
          echo "NOTES=release-notes/${VERSION}.md" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build the app and the javadoc
        run: ./mvnw --batch-mode --no-transfer-progress -Pjavadoc verify
      - name: Collect the release files with their checksums
        # the app jar, the javadoc jar and the pom.xml of the release, each with its
        # MD5 and SHA-1 checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir target/release
          for FILE in "target/cy3sbml-${VERSION}.jar" "target/cy3sbml-${VERSION}-javadoc.jar" pom.xml; do
            test -f "$FILE"
            cp "$FILE" target/release/
          done
          cd target/release
          for FILE in *; do
            md5sum "$FILE" > "$FILE.md5"
            sha1sum "$FILE" > "$FILE.sha1"
          done
          ls -l
      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: cy3sbml-${{ github.ref_name }}
          body_path: ${{ env.NOTES }}
          files: target/release/*

  sync-main:
    # main tracks the latest release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward main to the release
        # no --force: the push fails if it is not a fast-forward
        run: git push origin HEAD:main
