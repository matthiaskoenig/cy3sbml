name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  build:
    # builds and tests the release with read access only; the release job, which
    # can write, runs no build code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release notes
        # fail before the build if the release notes are missing
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "release-notes/${VERSION}.md" || {
            echo "::error::release-notes/${VERSION}.md is missing"
            exit 1
          }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        # no dependency cache: the release is built from freshly downloaded
        # dependencies, not from a cache that another workflow run wrote
        with:
          java-version: "17"
          distribution: temurin
      - name: Build the app and the javadoc
        run: ./mvnw --batch-mode --no-transfer-progress -Pjavadoc verify
      - name: Collect the release files with their checksums
        # the app jar, the javadoc jar and the pom.xml of the release, each with its
        # MD5 and SHA-1 checksum, and the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release/files
          for FILE in "target/cy3sbml-${VERSION}.jar" "target/cy3sbml-${VERSION}-javadoc.jar" pom.xml; do
            test -f "$FILE"
            cp "$FILE" target/release/files/
          done
          cp "release-notes/${VERSION}.md" target/release/notes.md
          cd target/release/files
          for FILE in *; do
            md5sum "$FILE" > "$FILE.md5"
            sha1sum "$FILE" > "$FILE.sha1"
          done
          ls -l
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: target/release
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # a rerun of the workflow replaces the files of the existing release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/files/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/files/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "cy3sbml-$GITHUB_REF_NAME" --notes-file release/notes.md
          fi

  sync-main:
    # main tracks the latest release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward main to the release
        # no --force: the push fails if it is not a fast-forward
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          git push
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          HEAD:main
