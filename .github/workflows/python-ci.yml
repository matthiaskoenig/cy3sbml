name: Python package

on:
  push:
    branches: [develop, main]
    paths:
      - "python/**"
      - "ruff.toml"
      - ".github/workflows/python-*.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "python/**"
      - "ruff.toml"
      - ".github/workflows/python-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
      - run: uv sync --locked --extra antimony
      - run: uv run --no-sync pytest -q
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          uv run --no-sync ruff check --output-format=github
          uv run --no-sync ruff format --check
          uv run --no-sync ty check --output-format=github
          uv build --no-sources
          uv run --no-sync twine check --strict dist/*
