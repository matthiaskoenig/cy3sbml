[project]
site_name = "cy3sbml"
site_url = "https://matthiaskoenig.github.io/cy3sbml/"
site_description = "SBML for Cytoscape"
site_author = "Matthias König"

copyright = 'Copyright &copy; 2012-2026 <a href="https://livermetabolism.com">Matthias König</a>'

repo_url = "https://github.com/matthiaskoenig/cy3sbml"
repo_name = "matthiaskoenig/cy3sbml"
edit_uri = "edit/develop/docs/"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "User guide" = [
    { "Importing SBML" = "guide/import.md" },
    { "Network model" = "guide/network.md" },
    { "Info panel and annotations" = "guide/info-panel.md" },
    { "Validation" = "guide/validation.md" },
    { "Styles" = "guide/styles.md" },
    { "Layouts" = "guide/layouts.md" },
    { "Cofactor nodes" = "guide/cofactors.md" },
    { "Supported SBML packages" = "guide/packages.md" },
  ] },
  { "Development" = [
    { "Building" = "development/building.md" },
    { "Architecture" = "development/architecture.md" },
    { "Testing" = "development/testing.md" },
    { "Code quality" = "development/quality.md" },
    { "Contributing" = "development/contributing.md" },
    { "Release process" = "development/release.md" },
  ] },
  { "Release notes" = "release-notes.md" },
  { "Citation" = "citation.md" },
]

[project.theme]
language = "en"
favicon = "images/favicon.ico"
logo = "images/logo100.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/cy3sbml"

[[project.extra.social]]
icon = "fontawesome/solid/store"
link = "https://apps.cytoscape.org/apps/cy3sbml"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
