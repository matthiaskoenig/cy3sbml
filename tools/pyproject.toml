[project]
name = "pycysbml"
version = "0.1.0"
description = "Python helpers for downloading and preparing the cy3sbml test models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "antimony>=3.2.0",
    "python-libsbml>=5.21.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
